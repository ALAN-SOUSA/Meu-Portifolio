<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form id="login" class="card" novalidate>
        <h2 style="margin:0 0 8px 0; font-size:18px;">Login</h2>

        <label for="login-username">Nome de usuário</label>
        <input id="login-username" name="username" type="text" required placeholder="Digite seu usuário" />

        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" required placeholder="Digite sua senha" />

        <div id="login-msg" aria-live="polite" style="margin-top: 8px; min-height: 18px;"></div>

        
        <button type="submit">Entrar</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
